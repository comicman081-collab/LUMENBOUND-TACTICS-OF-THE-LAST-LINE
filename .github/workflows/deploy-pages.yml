name: Deploy LUMENBOUND Web

on:
  push:
    branches:
      - main
    paths:
      - '.deploy/REQUEST'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: lumenbound-public
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout verified Web payload
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Verify and stamp Web payload
        shell: bash
        run: |
          set -euo pipefail
          WEB_ROOT="$GITHUB_WORKSPACE/builds/web_release"
          python3 - "$WEB_ROOT" "$GITHUB_SHA" <<'PY'
          import hashlib
          import json
          import re
          import sys
          from datetime import datetime, timezone
          from pathlib import Path

          root = Path(sys.argv[1]).resolve()
          deployment_commit = sys.argv[2]
          required = (
              "index.html", "index.js", "index.wasm", "index.pck",
              "index.service.worker.js", "index.manifest.json", "index.offline.html",
              "index.png", "index.icon.png", "index.apple-touch-icon.png",
              "index.144x144.png", "index.180x180.png", "index.512x512.png",
              "index.audio.worklet.js", "index.audio.position.worklet.js",
              "LICENSES.md", "README_HTML.md", "VERSION.json",
          )

          def fail(message: str) -> None:
              raise SystemExit(message)

          def digest(path: Path) -> str:
              value = hashlib.sha256()
              with path.open("rb") as handle:
                  for block in iter(lambda: handle.read(1024 * 1024), b""):
                      value.update(block)
              return value.hexdigest()

          if not root.is_dir():
              fail(f"Web payload directory is missing: {root}")
          missing = [name for name in required if not (root / name).is_file() or (root / name).stat().st_size <= 0]
          if missing:
              fail("Web payload is incomplete: " + ", ".join(missing))

          pck = root / "index.pck"
          wasm = root / "index.wasm"
          pck_size = pck.stat().st_size
          wasm_size = wasm.stat().st_size
          if not 100_000_000 < pck_size < 180_000_000:
              fail(f"Unexpected PCK size or unresolved LFS pointer: {pck_size}")
          with wasm.open("rb") as handle:
              if handle.read(4) != b"\x00asm":
                  fail("WebAssembly payload does not have the raw WASM magic")

          version_path = root / "VERSION.json"
          version = json.loads(version_path.read_text(encoding="utf-8"))
          pck_hash = digest(pck)
          wasm_hash = digest(wasm)
          if version.get("pck_sha256") != pck_hash or version.get("pck_size") != pck_size:
              fail("PCK hash/size does not match VERSION.json")
          if version.get("wasm_sha256") != wasm_hash or version.get("wasm_size") != wasm_size:
              fail("WASM hash/size does not match VERSION.json")
          runtime_source_commit = version.get("source_commit", "")
          if not re.fullmatch(r"[0-9a-f]{40}", runtime_source_commit):
              fail("VERSION.json has no exact runtime source commit")

          html_path = root / "index.html"
          html = html_path.read_text(encoding="utf-8")
          config_match = re.search(r"const GODOT_CONFIG = (\{.*?\});", html)
          if not config_match:
              fail("Godot Web configuration is missing from index.html")
          config = json.loads(config_match.group(1))
          if config.get("fileSizes", {}).get("index.pck") != pck_size:
              fail("index.html PCK size is stale")
          if config.get("fileSizes", {}).get("index.wasm") != wasm_size:
              fail("index.html WASM size is stale")
          if "LOADING LUMENBOUND TACTICAL DATA" not in html or "전술 기록을 불러오는 중" in html:
              fail("The public loading label must be English")

          manifest = json.loads((root / "index.manifest.json").read_text(encoding="utf-8"))
          if manifest.get("orientation") != "any":
              fail(f"Desktop/mobile orientation contract failed: {manifest.get('orientation')!r}")
          worker_path = root / "index.service.worker.js"
          worker = worker_path.read_text(encoding="utf-8")
          for token in (
              "const CACHE_PREFIX = 'LUMENBOUND-TACTICS-sw-cache-';",
              "self.skipWaiting()", "self.clients.claim()",
              "Navigation network error; using cached LUMENBOUND shell.",
          ):
              if token not in worker:
                  fail(f"Service-worker contract is missing: {token}")
          cache_digest = hashlib.sha256(
              "|".join(digest(path) for path in (pck, wasm, root / "index.js", html_path)).encode("utf-8")
          ).hexdigest()
          expected_cache_version = f"r7_{cache_digest[:16]}"
          if f"const CACHE_VERSION = '{expected_cache_version}';" not in worker:
              fail(f"Service-worker cache version is stale; expected {expected_cache_version}")

          version["deployment_commit"] = deployment_commit
          version["deployed_utc"] = datetime.now(timezone.utc).isoformat()
          version_path.write_text(
              json.dumps(version, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8", newline="\n",
          )
          (root / "DEPLOY_SHA.txt").write_text(
              f"deployment_commit={deployment_commit}\n"
              f"runtime_source_commit={runtime_source_commit}\n"
              f"pck_sha256={pck_hash}\n"
              f"pck_size={pck_size}\n"
              f"wasm_sha256={wasm_hash}\n"
              f"wasm_size={wasm_size}\n"
              "release_pack_mode=verified_prebuilt_full_web_export\n",
              encoding="utf-8", newline="\n",
          )
          print(f"WEB_PAYLOAD_PCK_SHA256={pck_hash}")
          print(f"WEB_PAYLOAD_PCK_BYTES={pck_size}")
          print(f"WEB_PAYLOAD_RUNTIME_SOURCE={runtime_source_commit}")
          print(f"WEB_PAYLOAD_DEPLOYMENT_COMMIT={deployment_commit}")
          print("WEB_PAYLOAD_VERIFY=PASS")
          PY
          echo "WEB_ROOT=$WEB_ROOT" >> "$GITHUB_ENV"

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload verified Web payload
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.WEB_ROOT }}

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
