name: Deploy LUMENBOUND Web

on:
  push:
    branches:
      - main
    paths:
      - '.deploy/REQUEST'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: lumenbound-public
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout current source
        uses: actions/checkout@v4

      - name: Install verified Godot 4.7.1
        shell: bash
        run: |
          set -euo pipefail
          GODOT_ZIP="$RUNNER_TEMP/Godot_v4.7.1-stable_linux.x86_64.zip"
          GODOT_DIR="$RUNNER_TEMP/godot-4.7.1"
          curl --fail --location --retry 3 --retry-delay 2 \
            --output "$GODOT_ZIP" \
            "https://github.com/godotengine/godot/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip"
          echo "c7ff14fd28472c8d4f193043de30278dcf7e5241a1dcf7566b02e27addaa33ba  $GODOT_ZIP" | sha256sum --check --strict
          mkdir -p "$GODOT_DIR"
          unzip -q "$GODOT_ZIP" -d "$GODOT_DIR"
          chmod +x "$GODOT_DIR/Godot_v4.7.1-stable_linux.x86_64"
          GODOT_LICENSE="$RUNNER_TEMP/Godot_LICENSE.txt"
          curl --fail --location --retry 3 --retry-delay 2 \
            --output "$GODOT_LICENSE" \
            "https://raw.githubusercontent.com/godotengine/godot/4.7.1-stable/LICENSE.txt"
          echo "b0435e3b3e4e55238f05f4b306f30524a1b2e20147810d436eaa554fa6855c80  $GODOT_LICENSE" | sha256sum --check --strict
          echo "GODOT_BIN=$GODOT_DIR/Godot_v4.7.1-stable_linux.x86_64" >> "$GITHUB_ENV"
          echo "GODOT_LICENSE=$GODOT_LICENSE" >> "$GITHUB_ENV"

      - name: Install verified official Web export templates
        shell: bash
        run: |
          set -euo pipefail
          XDG_ROOT="$RUNNER_TEMP/godot-data"
          TEMPLATE_DIR="$XDG_ROOT/godot/export_templates/4.7.1.stable"
          TEMPLATE_MANIFEST="$RUNNER_TEMP/godot-web-templates.json"
          mkdir -p "$TEMPLATE_DIR"
          python3 tools/install_godot_web_templates.py \
            --destination "$TEMPLATE_DIR" \
            --manifest "$TEMPLATE_MANIFEST"
          python3 - "$TEMPLATE_MANIFEST" <<'PY'
          import json
          import sys
          from pathlib import Path

          manifest = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          records = {record["file"]: record for record in manifest["records"]}
          expected = "b7b7d7da29fc6cc2f4934fdd26cc571a40e7af57f716ea3eb7e18da720dae28a"
          actual = records.get("web_nothreads_release.zip", {}).get("sha256")
          if actual != expected:
              raise SystemExit(f"Godot Web release template SHA mismatch: {actual}")
          print(f"GODOT_WEB_RELEASE_TEMPLATE_SHA256={actual}")
          PY
          echo "XDG_DATA_HOME=$XDG_ROOT" >> "$GITHUB_ENV"

      - name: Validate and configure current Web source
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/web/configure_runtime_web_imports.py
          python3 tools/validate_static.py

      - name: Export one complete current Web release
        shell: bash
        run: |
          set -euo pipefail
          WEB_STAGE="$RUNNER_TEMP/lumenbound-web-release"
          mkdir -p "$WEB_STAGE"
          "$GODOT_BIN" --headless \
            --path "$GITHUB_WORKSPACE/godot" \
            --export-release "Web HTML Release" \
            "$WEB_STAGE/index.html"
          test -s "$WEB_STAGE/index.html"
          test -s "$WEB_STAGE/index.js"
          test -s "$WEB_STAGE/index.wasm"
          test -s "$WEB_STAGE/index.pck"
          echo "WEB_STAGE=$WEB_STAGE" >> "$GITHUB_ENV"

      - name: Smoke current exported PCK in mobile portrait
        shell: bash
        run: |
          set -euo pipefail
          LOG="$RUNNER_TEMP/current-web-pck-smoke.log"
          set +e
          timeout 30s env LUMENBOUND_FORCE_PORTRAIT_QA=1 \
            "$GODOT_BIN" --headless --main-pack "$WEB_STAGE/index.pck" --quit-after 120 >"$LOG" 2>&1
          STATUS=$?
          set -e
          tail -120 "$LOG" || true
          test "$STATUS" -ne 124
          grep -F 'LUMENBOUND_MOBILE_PORTRAIT_V2_READY' "$LOG"
          grep -F 'LUMENBOUND_MOBILE_PORTRAIT_V2_ACTIVE screen=TITLE size=390x844' "$LOG"

      - name: Compress current WASM and finalize public staging
        shell: bash
        run: |
          set -euo pipefail
          cp tools/web/pako_inflate.min.js "$WEB_STAGE/pako_inflate.min.js"
          python3 tools/web/compress_web_wasm.py "$WEB_STAGE"
          python3 tools/web/instrument_web_soak.py "$WEB_STAGE"
          python3 tools/web/finalize_public_web.py "$WEB_STAGE" \
            --project-root "$GITHUB_WORKSPACE" \
            --godot-license "$GODOT_LICENSE" \
            --source-commit "$GITHUB_SHA"

      - name: Verify staged release is current and self-contained
        shell: bash
        run: |
          set -euo pipefail
          test "$(find "$WEB_STAGE" -maxdepth 1 -type f -name '*.pck' | wc -l)" -eq 1
          test "$(find "$WEB_STAGE" -maxdepth 1 -type f -name '*.wasm' | wc -l)" -eq 1
          grep -F 'release_pack_mode=fresh_full_web_export' "$WEB_STAGE/DEPLOY_SHA.txt"
          grep -F "source_commit=$GITHUB_SHA" "$WEB_STAGE/DEPLOY_SHA.txt"
          grep -F "const CACHE_PREFIX = 'LUMENBOUND-TACTICS-sw-cache-';" "$WEB_STAGE/index.service.worker.js"
          grep -F 'Navigation network error; using cached LUMENBOUND shell.' "$WEB_STAGE/index.service.worker.js"

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload current Web staging
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.WEB_STAGE }}

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
