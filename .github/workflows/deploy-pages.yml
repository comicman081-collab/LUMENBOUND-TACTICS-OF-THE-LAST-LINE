name: Deploy LUMENBOUND Web

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: lumenbound-public
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Verify production art donor PCK
        shell: bash
        run: |
          set -euo pipefail
          PCK="$GITHUB_WORKSPACE/builds/web_release/index.pck"
          test -s "$PCK"
          echo "6ae8374b15e1af6dbf1de35745f3eb7274b52d240347f529b95ac20737902df6  $PCK" | sha256sum --check --strict
          test "$(stat -c%s "$PCK")" -eq 218741320

      - name: Install Godot 4.7.1
        shell: bash
        run: |
          set -euo pipefail
          GODOT_ZIP="$RUNNER_TEMP/Godot_v4.7.1-stable_linux.x86_64.zip"
          GODOT_DIR="$RUNNER_TEMP/godot-4.7.1"
          curl --fail --location --retry 3 --retry-delay 2 \
            --output "$GODOT_ZIP" \
            "https://github.com/godotengine/godot/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip"
          echo "c7ff14fd28472c8d4f193043de30278dcf7e5241a1dcf7566b02e27addaa33ba  $GODOT_ZIP" | sha256sum --check --strict
          mkdir -p "$GODOT_DIR"
          unzip -q "$GODOT_ZIP" -d "$GODOT_DIR"
          chmod +x "$GODOT_DIR/Godot_v4.7.1-stable_linux.x86_64"
          echo "GODOT_BIN=$GODOT_DIR/Godot_v4.7.1-stable_linux.x86_64" >> "$GITHUB_ENV"

      - name: Install Godot PCK Tool 2.3
        shell: bash
        run: |
          set -euo pipefail
          PCK_TOOL="$RUNNER_TEMP/godotpcktool"
          curl --fail --location --retry 3 --retry-delay 2 \
            --output "$PCK_TOOL" \
            "https://github.com/hhyyrylainen/GodotPckTool/releases/download/v2.3/godotpcktool"
          echo "1add2c22aeacdd7a8372288c885ed0ff4d2f673787aed924c54522a0f000d655  $PCK_TOOL" | sha256sum --check --strict
          chmod +x "$PCK_TOOL"
          echo "PCK_TOOL=$PCK_TOOL" >> "$GITHUB_ENV"

      - name: Export complete current source pack
        shell: bash
        run: |
          set -euo pipefail
          CURRENT_PCK="$RUNNER_TEMP/current_source_full.pck"
          "$GODOT_BIN" --headless \
            --path "$GITHUB_WORKSPACE/godot" \
            --export-pack "Web HTML Release" \
            "$CURRENT_PCK"
          test -s "$CURRENT_PCK"
          echo "CURRENT_PCK=$CURRENT_PCK" >> "$GITHUB_ENV"

      - name: Merge current runtime into production art and repack cleanly
        shell: bash
        run: |
          set -euo pipefail
          DONOR_PCK="$GITHUB_WORKSPACE/builds/web_release/index.pck"
          DONOR_DIR="$RUNNER_TEMP/production_donor"
          CURRENT_DIR="$RUNNER_TEMP/current_source"
          MERGED_DIR="$RUNNER_TEMP/merged_release"
          MERGED_PCK="$RUNNER_TEMP/index.merged.pck"

          mkdir -p "$DONOR_DIR" "$CURRENT_DIR" "$MERGED_DIR"
          "$PCK_TOOL" "$DONOR_PCK" -a e -o "$DONOR_DIR"
          "$PCK_TOOL" "$CURRENT_PCK" -a e -o "$CURRENT_DIR"

          cp -a "$DONOR_DIR"/. "$MERGED_DIR"/
          cp -a "$CURRENT_DIR"/. "$MERGED_DIR"/

          test -s "$MERGED_DIR/project.binary"
          test -s "$MERGED_DIR/autoload/mobile_portrait_hotfix_v2.gdc"
          test -s "$MERGED_DIR/autoload/mobile_portrait_hotfix_v2.gd.remap"
          test -s "$MERGED_DIR/screens/app_shell.gdc"
          test -s "$MERGED_DIR/chapter_map/runtime/chapter_map_screen.gdc"
          test -s "$MERGED_DIR/assets/art/asset_manifest.json"
          test -s "$MERGED_DIR/assets/art/backgrounds/BG_STORY_RELAY/bg_story_relay_1920x1080.png.import"
          test -s "$MERGED_DIR/assets/runtime_web/runtime_asset_manifest.json"
          strings "$MERGED_DIR/project.binary" | grep -F 'mobile_portrait_hotfix_v2' >/dev/null

          rm -f "$MERGED_PCK"
          "$PCK_TOOL" "$MERGED_PCK" -a a "$MERGED_DIR" \
            --remove-prefix "$MERGED_DIR" \
            --set-godot-version 4.7.1
          test -s "$MERGED_PCK"
          test "$(stat -c%s "$MERGED_PCK")" -gt 150000000
          mv "$MERGED_PCK" "$DONOR_PCK"

          "$PCK_TOOL" "$DONOR_PCK" > "$RUNNER_TEMP/final_pck_contents.txt"
          grep -F 'res://autoload/mobile_portrait_hotfix_v2.gdc' "$RUNNER_TEMP/final_pck_contents.txt"
          grep -F 'res://screens/app_shell.gdc' "$RUNNER_TEMP/final_pck_contents.txt"
          grep -F 'res://chapter_map/runtime/chapter_map_screen.gdc' "$RUNNER_TEMP/final_pck_contents.txt"
          grep -F 'assets/art/backgrounds/BG_STORY_RELAY' "$RUNNER_TEMP/final_pck_contents.txt" | head -5
          grep -F 'assets/runtime_web/runtime_asset_manifest.json' "$RUNNER_TEMP/final_pck_contents.txt"

      - name: Smoke final PCK with portrait layout active
        shell: bash
        run: |
          set -euo pipefail
          PCK="$GITHUB_WORKSPACE/builds/web_release/index.pck"
          LOG="$RUNNER_TEMP/final_pck_smoke.log"
          set +e
          timeout 30s env LUMENBOUND_FORCE_PORTRAIT_QA=1 \
            "$GODOT_BIN" --headless --main-pack "$PCK" --quit-after 120 >"$LOG" 2>&1
          STATUS=$?
          set -e
          tail -120 "$LOG" || true
          test "$STATUS" -ne 124
          grep -F 'LUMENBOUND_MOBILE_PORTRAIT_V2_READY' "$LOG"
          grep -F 'LUMENBOUND_MOBILE_PORTRAIT_V2_ACTIVE screen=TITLE size=390x844' "$LOG"

      - name: Rotate caches, stamp build and sync PCK size
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from datetime import datetime, timezone
          import hashlib
          import json
          import os
          import re

          root = Path(os.environ["GITHUB_WORKSPACE"]) / "builds" / "web_release"
          sha = os.environ["GITHUB_SHA"]
          pck = root / "index.pck"
          pck_hash = hashlib.sha256(pck.read_bytes()).hexdigest()
          pck_size = pck.stat().st_size

          worker_path = root / "index.service.worker.js"
          worker = worker_path.read_text(encoding="utf-8")
          replacement = f"const CACHE_VERSION = 'portrait_v2_{sha[:16]}';"
          worker, count = re.subn(r"const CACHE_VERSION = '[^']+';", replacement, worker, count=1)
          if count != 1:
              raise SystemExit("Could not rotate Godot PWA CACHE_VERSION")
          if "self.skipWaiting()" not in worker or "self.clients.claim()" not in worker:
              raise SystemExit("Release service worker lost immediate-update policy")
          worker_path.write_text(worker, encoding="utf-8")

          html_path = root / "index.html"
          html = html_path.read_text(encoding="utf-8")
          html, size_count = re.subn(
              r'("index\.pck"\s*:\s*)\d+',
              lambda m: m.group(1) + str(pck_size),
              html,
              count=1,
          )
          if size_count != 1:
              raise SystemExit("Could not synchronize index.pck file size in index.html")

          marker = "const engine = new Engine(GODOT_CONFIG);"
          if marker not in html:
              raise SystemExit("Godot engine bootstrap marker missing")
          boot_lines = [
              marker,
              f"const LUMENBOUND_BUILD_ID = '{sha}';",
              "const LUMENBOUND_ORIGINAL_START_GAME = engine.startGame.bind(engine);",
              "async function lumenboundFreshBoot() {",
              "  if (!('serviceWorker' in navigator) || !('caches' in window)) return;",
              "  const key = 'lumenbound-active-build';",
              "  let previous = null;",
              "  try { previous = localStorage.getItem(key); } catch (_) {}",
              "  if (previous === LUMENBOUND_BUILD_ID) {",
              "    try {",
              "      const registration = await navigator.serviceWorker.getRegistration();",
              "      if (registration) registration.update().catch(() => {});",
              "    } catch (_) {}",
              "    return;",
              "  }",
              "  try {",
              "    const registrations = await navigator.serviceWorker.getRegistrations();",
              "    await Promise.all(registrations.map((registration) => registration.unregister()));",
              "    const cacheKeys = await caches.keys();",
              "    await Promise.all(cacheKeys",
              "      .filter((name) => name.startsWith('LUMENBOUND-TACTICS-sw-cache-'))",
              "      .map((name) => caches.delete(name)));",
              "  } catch (err) {",
              "    console.warn('LUMENBOUND fresh-build cache reset warning', err);",
              "  }",
              "  try { localStorage.setItem(key, LUMENBOUND_BUILD_ID); } catch (_) {}",
              "}",
              "engine.startGame = (options) => lumenboundFreshBoot().then(() => LUMENBOUND_ORIGINAL_START_GAME(options));",
          ]
          html = html.replace(marker, "\n".join(boot_lines), 1)
          html_path.write_text(html, encoding="utf-8")

          version_path = root / "VERSION.json"
          version = json.loads(version_path.read_text(encoding="utf-8"))
          version["pck_sha256"] = pck_hash
          version["pck_size"] = pck_size
          version["source_commit"] = sha
          version["mobile_portrait_fix"] = True
          version["mobile_portrait_revision"] = 2
          version["release_pack_mode"] = "clean_repack_production_art_plus_current_runtime"
          version["production_art_donor_sha256"] = "6ae8374b15e1af6dbf1de35745f3eb7274b52d240347f529b95ac20737902df6"
          version["created_utc"] = datetime.now(timezone.utc).isoformat()
          version_path.write_text(json.dumps(version, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")

          (root / "DEPLOY_SHA.txt").write_text(
              f"source_commit={sha}\n"
              f"pck_sha256={pck_hash}\n"
              f"pck_size={pck_size}\n"
              "release_pack_mode=clean_repack_production_art_plus_current_runtime\n"
              "mobile_portrait_revision=2\n"
              "mobile_portrait_fix=story_header,story_controls,story_art,story_dialogue,map_header,map_toolbar,map_overlay,map_detail,map_tutorial\n",
              encoding="utf-8",
          )
          PY

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Web build
        uses: actions/upload-pages-artifact@v3
        with:
          path: builds/web_release

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
