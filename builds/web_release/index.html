			(() => {
				const enforcePublicTitle = () => {
					if (document.title !== 'LUMENBOUND: TACTICS OF THE LAST LINE') document.title = 'LUMENBOUND: TACTICS OF THE LAST LINE';
				};
				window.addEventListener('load', () => {
					enforcePublicTitle();
					const titleNode = document.querySelector('title');
					if (titleNode) new MutationObserver(enforcePublicTitle).observe(titleNode, {
						childList: true, subtree: true, characterData: true
					});
				});
			})();

			<div id="status-copy">LUMENBOUND 전술 기록을 불러오는 중 · <span id="status-percent">0%</span></div>

		<script src="index.js"></script>
		<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":false,"executable":"index","experimentalVK":true,"fileSizes":{"index.pck":140166452,"index.wasm":39513091},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4,"serviceWorker":"index.service.worker.js"};
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusPercent = document.getElementById('status-percent');
	const statusNotice = document.getElementById('status-notice');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			// There's a chance that installing the service worker would fix the issue
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				// Reload if there was no error.
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			// Display the message as usual
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					statusProgress.value = current;
					statusProgress.max = total;
					statusPercent.textContent = Math.max(1, Math.min(100, Math.round(current / total * 100))) + '%';
				} else {
					statusProgress.removeAttribute('value');
					statusProgress.removeAttribute('max');
				}
			},
		}).then(() => {
			setStatusMode('hidden');
		}, displayFailureNotice);
	}
}());
		</script>
	<script id="r7-web-soak-probe">
(() => {
  if (!new URLSearchParams(location.search).has('r7-soak')) return;
  const samples = [];
  const windowMs = 5000;
  const percentile = (values, ratio) => {
    if (!values.length) return 0;
    const sorted = [...values].sort((a, b) => a - b);
    return sorted[Math.min(sorted.length - 1, Math.floor((sorted.length - 1) * ratio))];
  };
  let last = performance.now();
  let started = last;
  let lastReport = last;
  let frames = 0;
  let longFrames = 0;
  const report = (now) => {
    const frameTimes = samples.splice(0, samples.length);
    const memory = performance.memory || null;
    const payload = {
      elapsed_seconds: Number(((now - started) / 1000).toFixed(3)),
      window_seconds: Number(((now - lastReport) / 1000).toFixed(3)),
      frames,
      average_fps: Number((frames * 1000 / Math.max(1, now - lastReport)).toFixed(2)),
      p50_ms: Number(percentile(frameTimes, 0.50).toFixed(3)),
      p95_ms: Number(percentile(frameTimes, 0.95).toFixed(3)),
      p99_ms: Number(percentile(frameTimes, 0.99).toFixed(3)),
      long_frames_gt_100ms: longFrames,
      used_js_heap_bytes: memory ? memory.usedJSHeapSize : null,
      total_js_heap_bytes: memory ? memory.totalJSHeapSize : null,
    };
    console.log('R7_RAF_SAMPLE ' + JSON.stringify(payload));
    lastReport = now;
    frames = 0;
    longFrames = 0;
  };
  const tick = (now) => {
    const delta = now - last;
    last = now;
    if (delta > 0 && delta < 1000) {
      samples.push(delta);
      if (delta > 100) longFrames += 1;
    }
    frames += 1;
    if (now - lastReport >= windowMs) report(now);
    requestAnimationFrame(tick);
  };
  console.log('R7_RAF_PROBE_READY window_ms=' + windowMs);
  requestAnimationFrame(tick);
})();
</script>
