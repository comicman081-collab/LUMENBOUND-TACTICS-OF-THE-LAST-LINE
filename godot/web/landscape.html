<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0">
		<title>$GODOT_PROJECT_NAME</title>
		<style>
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

body {
	color: white;
	background-color: black;
	overflow: hidden;
	touch-action: none;
}

/* A tall desktop tool window can letterbox a landscape game, but the host
   itself must still look intentional while preserving the game's 16:9 frame. */
body.landscape-host {
	background: radial-gradient(ellipse at center, #142332 0%, #09111a 52%, #030609 100%);
}

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

#status, #status-splash, #status-progress {
	position: absolute;
	left: 0;
	right: 0;
}

#status, #status-splash {
	top: 0;
	bottom: 0;
}

#status {
	background-color: $GODOT_SPLASH_COLOR;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	visibility: hidden;
}

#status-splash {
	max-height: 100%;
	max-width: 100%;
	margin: auto;
}

#status-splash.show-image--false {
	display: none;
}

#status-splash.fullsize--true {
	height: 100%;
	width: 100%;
	object-fit: contain;
}

#status-splash.use-filter--false {
	image-rendering: pixelated;
}

#status-progress, #status-notice {
	display: none;
}

#status-progress {
	bottom: 10%;
	width: 50%;
	margin: 0 auto;
}

#status-notice {
	background-color: #5b3943;
	border-radius: 0.5rem;
	border: 1px solid #9b3943;
	color: #e0e0e0;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	line-height: 1.3;
	margin: 0 2rem;
	overflow: hidden;
	padding: 1rem;
	text-align: center;
	z-index: 1;
}
		/* The host rotates a full-size landscape frame. Input coordinates are
   transformed by the browser at the frame boundary, including real touch. */
body.landscape-host > #canvas, body.landscape-host > #status { display: none !important; }
#landscape-game {
	position: fixed;
	left: 50%;
	top: 50%;
	border: 0;
	background: #050a11;
	box-shadow: 0 18px 64px #00000099;
	transform-origin: center;
}
</style>
		$GODOT_HEAD_INCLUDE
	</head>
	<body>
		<canvas id="canvas">
			Your browser does not support the canvas tag.
		</canvas>

		<noscript>
			Your browser does not support JavaScript.
		</noscript>

		<div id="status">
			<img id="status-splash" class="$GODOT_SPLASH_CLASSES" src="$GODOT_SPLASH" alt="">
			<progress id="status-progress"></progress>
			<div id="status-notice"></div>
		</div>

		<script src="$GODOT_URL"></script>
		<script>
const GODOT_CONFIG = $GODOT_CONFIG;
const GODOT_THREADS_ENABLED = $GODOT_THREADS_ENABLED;
const engine = new Engine(GODOT_CONFIG);

(function () {
	if (!new URLSearchParams(location.search).has('landscape-frame')) {
		document.body.classList.add('landscape-host');
		const frame = document.createElement('iframe');
		frame.id = 'landscape-game';
		frame.title = 'LUMENBOUND';
		frame.allow = 'autoplay; fullscreen';
		const target = new URL(location.href);
		target.searchParams.set('landscape-frame', '1');
		// Orientation follows the device, never the window's shape.  In particular,
		// embedded PC browsers can report userAgentData.mobile=true even on Windows;
		// the platform must win there or a narrow desktop window rotates the game.
		const userAgent = navigator.userAgent || '';
		const platform = navigator.userAgentData?.platform || navigator.platform || '';
		const ipadDesktopUserAgent = platform === 'MacIntel' && navigator.maxTouchPoints > 1;
		const desktopPointer = navigator.maxTouchPoints === 0
			&& window.matchMedia?.('(any-pointer: fine)').matches === true;
		const desktopPlatform = !ipadDesktopUserAgent && (
			/^Win(?:32|64)?$/i.test(platform)
			|| /^Linux (?:x86_64|i[3-6]86)$/i.test(platform)
			|| /^MacIntel$/i.test(platform)
			|| /Windows NT|X11; Linux (?:x86_64|i[3-6]86)|Macintosh/i.test(userAgent)
			|| desktopPointer
		);
		const mobileDevice = !desktopPlatform && (
			navigator.userAgentData?.mobile === true
			|| /Android|iPhone|iPad|iPod/i.test(userAgent)
			|| ipadDesktopUserAgent
		);
		frame.dataset.deviceClass = mobileDevice ? 'mobile' : 'desktop';
		const fit = () => {
			const width = window.innerWidth, height = window.innerHeight;
			const rotated = mobileDevice && height > width;
			frame.style.width = (mobileDevice ? Math.max(width, height) : width) + 'px';
			frame.style.height = (mobileDevice ? Math.min(width, height) : Math.min(height, width * 9 / 16)) + 'px';
			frame.style.transform = 'translate(-50%, -50%)' + (rotated ? ' rotate(90deg)' : '');
			frame.dataset.rotated = rotated ? '1' : '0';
		};
		fit();
		frame.src = target.href;
		document.body.appendChild(frame);
		window.addEventListener('resize', fit);
		return;
	}
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			// There's a chance that installing the service worker would fix the issue
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				// Reload if there was no error.
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			// Display the message as usual
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					statusProgress.value = current;
					statusProgress.max = total;
				} else {
					statusProgress.removeAttribute('value');
					statusProgress.removeAttribute('max');
				}
			},
		}).then(() => {
			setStatusMode('hidden');
		}, displayFailureNotice);
	}
}());
		</script>
	</body>
</html>
